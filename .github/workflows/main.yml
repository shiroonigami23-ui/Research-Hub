name: Research Hub Pipeline
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Inject Research Key
        run: sed -i "s/RESEARCH_API_KEY_PLACEHOLDER/${{ secrets.RESEARCH_API_KEY }}/g" js/events.js
      - name: Production Deployment
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          