<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af"/>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to our new, organized CSS file -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-900 text-slate-200">

    <div class="container mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8 md:mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight">Research Hub</h1>
            <p class="text-slate-400 mt-2 text-lg">Your personal dashboard for organizing project resources.</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <aside class="lg:col-span-1 space-y-8">
                <div class="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 shadow-lg border border-slate-700">
                    <h2 class="text-2xl font-semibold mb-4 text-white">My Projects</h2>
                    <ul id="project-list" class="space-y-2">
                        <!-- Project items will be dynamically inserted here -->
                    </ul>
                    <form id="add-project-form" class="mt-4 flex gap-2">
                        <input type="text" id="new-project-name" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="New Project Name..." required>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-all duration-200 transform hover:scale-105">Add</button>
                    </form>
                </div>

                <div class="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 shadow-lg border border-slate-700">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Add New Resource</h2>
                    <form id="add-resource-form" class="space-y-4">
                        <div>
                            <label for="resource-url" class="block text-sm font-medium text-slate-300 mb-1">URL</label>
                            <input type="url" id="resource-url" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com" required>
                        </div>
                        <div>
                            <label for="resource-notes" class="block text-sm font-medium text-slate-300 mb-1">Notes</label>
                            <textarea id="resource-notes" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Briefly describe why this link is useful..."></textarea>
                        </div>
                        <div>
                            <label for="resource-tags" class="block text-sm font-medium text-slate-300 mb-1">Tags (comma-separated)</label>
                            <input type="text" id="resource-tags" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. primary-source, data">
                        </div>
                        <div>
                            <label for="project-select" class="block text-sm font-medium text-slate-300 mb-1">Assign to Project</label>
                            <select id="project-select" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md transition-all duration-200 transform hover:scale-105 shadow-lg">Save Resource</button>
                    </form>
                </div>
            </aside>

            <section class="lg:col-span-2">
                <div id="resource-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Resource cards will be dynamically inserted here -->
                </div>
                 <div id="empty-state" class="hidden text-center py-20 px-6 bg-slate-800/50 rounded-xl border border-slate-700">
                    <svg class="mx-auto h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2z" /></svg>
                    <h3 class="mt-4 text-lg font-medium text-white">No resources found</h3>
                    <p class="mt-1 text-slate-400">Add a resource or select a different project to get started.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Resource Modal -->
    <div id="edit-resource-modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4">
        <div class="modal-content bg-slate-800 rounded-lg p-6 shadow-2xl w-full max-w-lg border border-slate-600">
            <h2 class="text-2xl font-semibold mb-4 text-white">Edit Resource</h2>
            <form id="edit-resource-form" class="space-y-4">
                <input type="hidden" id="edit-resource-id">
                <div>
                    <label for="edit-resource-url" class="block text-sm font-medium text-slate-300 mb-1">URL</label>
                    <input type="url" id="edit-resource-url" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label for="edit-resource-notes" class="block text-sm font-medium text-slate-300 mb-1">Notes</label>
                    <textarea id="edit-resource-notes" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label for="edit-resource-tags" class="block text-sm font-medium text-slate-300 mb-1">Tags (comma-separated)</label>
                    <input type="text" id="edit-resource-tags" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex gap-4 pt-2">
                    <button type="button" id="cancel-edit-resource" class="w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Cancel</button>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Project Modal -->
    <div id="edit-project-modal" class="modal-overlay fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4">
        <div class="modal-content bg-slate-800 rounded-lg p-6 shadow-2xl w-full max-w-md border border-slate-600">
            <h2 class="text-2xl font-semibold mb-4 text-white">Rename Project</h2>
            <form id="edit-project-form" class="space-y-4">
                <input type="hidden" id="edit-project-id">
                <div>
                    <label for="edit-project-name" class="block text-sm font-medium text-slate-300 mb-1">Project Name</label>
                    <input type="text" id="edit-project-name" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex gap-4 pt-2">
                    <button type="button" id="cancel-edit-project" class="w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Cancel</button>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Save Name</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="notification" class="fixed bottom-5 right-5 bg-red-600 text-white py-2 px-5 rounded-lg shadow-lg opacity-0 transition-all duration-300 transform translate-y-4">
        <!-- Message will be inserted here -->
    </div>

    <!-- Use type="module" to allow import/export statements -->
    <script type="module" src="js/main.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(e => console.error('SW registration failed:', e));
            });
        }
    </script>
</body>
</html>
