<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7"/>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">

</head>
<body class="bg-slate-900 text-slate-300"> <!-- Default text is now slate-300 -->

    <div class="video-background-container">
        <video autoplay muted loop playsinline class="video-background">
            <source src="menu-background.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="relative z-10">
        <div class="container mx-auto p-4 md:p-8">
            
            <header class="text-center mb-8">
                <h1 class="text-4xl md:text-5xl font-bold text-white [text-shadow:_0_2px_10px_rgb(0_0_0_/_50%)]">Research Hub</h1>
                <p class="text-slate-400 mt-2 [text-shadow:_0_1px_5px_rgb(0_0_0_/_50%)]">Your personal dashboard for organizing project resources.</p>
            </header>

            <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <aside class="lg:col-span-1 space-y-8">
                    <div class="ui-panel">
                        <h2 class="text-2xl font-semibold text-white mb-4">My Projects</h2>
                        <ul id="project-list" class="space-y-2"></ul>
                        <form id="add-project-form" class="mt-4 flex gap-2">
                            <!-- Input text is now slate-200 -->
                            <input type="text" id="new-project-name" class="futuristic-input w-full text-slate-200 placeholder-slate-500" placeholder="New Project Name..." required>
                            <button type="submit" class="futuristic-btn btn-primary text-slate-200 font-bold py-2 px-4 rounded-md">Add</button>
                        </form>
                    </div>

                    <div class="ui-panel">
                        <h2 class="text-2xl font-semibold text-white mb-4">Add New Resource</h2>
                        <form id="add-resource-form" class="space-y-4">
                            <div>
                                <!-- Labels are now a softer slate-400 -->
                                <label for="resource-url" class="block text-sm font-medium text-slate-400 mb-1">URL</label>
                                <input type="url" id="resource-url" class="futuristic-input w-full text-slate-200" placeholder="https://example.com" required>
                            </div>
                            <div>
                                <label for="resource-notes" class="block text-sm font-medium text-slate-400 mb-1">Notes</label>
                                <textarea id="resource-notes" rows="3" class="futuristic-input w-full text-slate-200" placeholder="Briefly describe why this link is useful..."></textarea>
                            </div>
                            <div>
                                <label for="resource-tags" class="block text-sm font-medium text-slate-400 mb-1">Tags (comma-separated)</label>
                                <input type="text" id="resource-tags" class="futuristic-input w-full text-slate-200" placeholder="e.g. primary-source, data">
                            </div>
                            <div>
                                <label for="project-select" class="block text-sm font-medium text-slate-400 mb-1">Assign to Project</label>
                                <select id="project-select" class="futuristic-input w-full text-slate-200"></select>
                            </div>
                            <button type="submit" class="futuristic-btn btn-success w-full text-slate-200 font-bold py-2 px-4 rounded-md">Save Resource</button>
                        </form>
                    </div>
                </aside>

                <section class="lg:col-span-2">
                    <div class="mb-6 relative">
                         <input type="text" id="search-input" class="futuristic-input w-full text-slate-200 pl-10" placeholder="Search resources by notes, URL, or tags...">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                    </div>

                    <div id="resource-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                     <div id="empty-state" class="hidden text-center py-20 ui-panel">
                        <svg class="mx-auto h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2z" /></svg>
                        <h3 class="mt-2 text-lg font-medium text-white">No resources found</h3>
                        <p class="mt-1 text-slate-400">Get started by adding a resource or try a different filter.</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <div id="edit-resource-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 modal-overlay">
        <div class="ui-panel w-full max-w-lg modal-content">
            <h2 class="text-2xl font-semibold text-white mb-4">Edit Resource</h2>
            <form id="edit-resource-form" class="space-y-4">
                <input type="hidden" id="edit-resource-id">
                <div>
                    <label for="edit-resource-url" class="block text-sm font-medium text-slate-400 mb-1">URL</label>
                    <input type="url" id="edit-resource-url" class="futuristic-input w-full text-slate-200" required>
                </div>
                <div>
                    <label for="edit-resource-notes" class="block text-sm font-medium text-slate-400 mb-1">Notes</label>
                    <textarea id="edit-resource-notes" rows="3" class="futuristic-input w-full text-slate-200"></textarea>
                </div>
                <div>
                    <label for="edit-resource-tags" class="block text-sm font-medium text-slate-400 mb-1">Tags (comma-separated)</label>
                    <input type="text" id="edit-resource-tags" class="futuristic-input w-full text-slate-200">
                </div>
                <div class="flex gap-4">
                    <button type="button" id="cancel-edit-resource" class="futuristic-btn btn-secondary w-full text-slate-200 font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit" class="futuristic-btn btn-success w-full text-slate-200 font-bold py-2 px-4 rounded-md">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="edit-project-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4 modal-overlay">
        <div class="ui-panel w-full max-w-md modal-content">
            <h2 class="text-2xl font-semibold text-white mb-4">Rename Project</h2>
            <form id="edit-project-form" class="space-y-4">
                <input type="hidden" id="edit-project-id">
                <div>
                    <label for="edit-project-name" class="block text-sm font-medium text-slate-400 mb-1">Project Name</label>
                    <input type="text" id="edit-project-name" class="futuristic-input w-full text-slate-200" required>
                </div>
                <div class="flex gap-4">
                    <button type="button" id="cancel-edit-project" class="futuristic-btn btn-secondary w-full text-slate-200 font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit" class="futuristic-btn btn-primary w-full text-slate-200 font-bold py-2 px-4 rounded-md">Save Name</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="notification" class="fixed bottom-5 right-5 bg-red-600/90 backdrop-blur-sm text-white py-2 px-5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 border border-red-500/50"></div>

    <script type="module" src="js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(e => console.error('SW registration failed:', e));
            });
        }
    </script>
</body>
</html>
