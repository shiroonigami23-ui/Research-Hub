<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7"/>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">

</head>
<body class="bg-slate-900 text-slate-200">

    <div class="container mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white">Research Hub</h1>
            <p class="text-slate-400 mt-2">Your personal dashboard for organizing project resources.</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <aside class="lg:col-span-1 space-y-8">
                <!-- Left column content remains the same -->
                <div class="bg-slate-800 rounded-lg p-6 shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 text-white">My Projects</h2>
                    <ul id="project-list" class="space-y-2"></ul>
                    <form id="add-project-form" class="mt-4 flex gap-2">
                        <input type="text" id="new-project-name" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="New Project Name..." required>
                        <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Add</button>
                    </form>
                </div>

                <div class="bg-slate-800 rounded-lg p-6 shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Add New Resource</h2>
                    <form id="add-resource-form" class="space-y-4">
                        <!-- Add resource form content remains the same -->
                        <div>
                            <label for="resource-url" class="block text-sm font-medium text-slate-300 mb-1">URL</label>
                            <input type="url" id="resource-url" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white" placeholder="https://example.com" required>
                        </div>
                        <div>
                            <label for="resource-notes" class="block text-sm font-medium text-slate-300 mb-1">Notes</label>
                            <textarea id="resource-notes" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white" placeholder="Briefly describe why this link is useful..."></textarea>
                        </div>
                        <div>
                            <label for="resource-tags" class="block text-sm font-medium text-slate-300 mb-1">Tags (comma-separated)</label>
                            <input type="text" id="resource-tags" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white" placeholder="e.g. primary-source, data">
                        </div>
                        <div>
                            <label for="project-select" class="block text-sm font-medium text-slate-300 mb-1">Assign to Project</label>
                            <select id="project-select" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white"></select>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Save Resource</button>
                    </form>
                </div>
            </aside>

            <section class="lg:col-span-2">
                <!-- *** NEW SEARCH BAR *** -->
                <div class="mb-6 relative">
                    <input type="text" id="search-input" class="w-full bg-slate-800 border border-slate-700 rounded-md pl-10 pr-4 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Search resources by notes, URL, or tags...">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                </div>

                <div id="resource-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                 <div id="empty-state" class="hidden text-center py-20">
                    <svg class="mx-auto h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2z" /></svg>
                    <h3 class="mt-2 text-lg font-medium text-white">No resources found</h3>
                    <p class="mt-1 text-slate-400">Get started by adding a resource or try a different filter.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals and Notification elements remain the same -->
    <div id="edit-resource-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4 modal-overlay"><!-- ... --></div>
    <div id="edit-project-modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4 modal-overlay"><!-- ... --></div>
    <div id="notification" class="fixed bottom-5 right-5 bg-red-600 text-white py-2 px-5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300"></div>

    <script type="module" src="js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(e => console.error('SW registration failed:', e));
            });
        }
    </script>
</body>
</html>
