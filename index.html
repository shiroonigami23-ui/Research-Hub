<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Hub</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-200">

    <div class="container mx-auto p-4 md:p-8">
        
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-white">Research Hub</h1>
            <p class="text-slate-400 mt-2">Your personal dashboard for organizing project resources.</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Left Column: Controls & Forms -->
            <aside class="lg:col-span-1 space-y-8">
                
                <!-- Projects Section -->
                <div class="bg-slate-800 rounded-lg p-6 shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 text-white">My Projects</h2>
                    <ul id="project-list" class="space-y-2">
                        <!-- Project items will be dynamically inserted here by script.js -->
                    </ul>
                    <form id="add-project-form" class="mt-4 flex gap-2">
                        <input type="text" id="new-project-name" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="New Project Name..." required>
                        <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Add</button>
                    </form>
                </div>

                <!-- Add Resource Section -->
                <div class="bg-slate-800 rounded-lg p-6 shadow-lg">
                    <h2 class="text-2xl font-semibold mb-4 text-white">Add New Resource</h2>
                    <form id="add-resource-form" class="space-y-4">
                        <div>
                            <label for="resource-url" class="block text-sm font-medium text-slate-300 mb-1">URL</label>
                            <input type="url" id="resource-url" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="https://example.com" required>
                        </div>
                        <div>
                            <label for="resource-notes" class="block text-sm font-medium text-slate-300 mb-1">Notes</label>
                            <textarea id="resource-notes" rows="3" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Briefly describe why this link is useful..."></textarea>
                        </div>
                        <div>
                            <label for="resource-tags" class="block text-sm font-medium text-slate-300 mb-1">Tags</label>
                            <input type="text" id="resource-tags" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="e.g. primary-source, data, tutorial">
                             <p class="text-xs text-slate-500 mt-1">Separate tags with commas.</p>
                        </div>
                        <div>
                            <label for="project-select" class="block text-sm font-medium text-slate-300 mb-1">Assign to Project</label>
                            <select id="project-select" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-sky-500">
                                <!-- Project options will be dynamically inserted here by script.js -->
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Save Resource</button>
                    </form>
                </div>
            </aside>

            <!-- Right Column: Resource Cards -->
            <section class="lg:col-span-2">
                <div id="resource-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Resource cards will be dynamically inserted here by script.js -->
                </div>
                 <div id="empty-state" class="hidden text-center py-20">
                    <svg class="mx-auto h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2z" />
                    </svg>
                    <h3 class="mt-2 text-lg font-medium text-white">No resources found</h3>
                    <p class="mt-1 text-slate-400">Get started by adding a resource using the form on the left.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="script.js"></script>
</body>
</html>
